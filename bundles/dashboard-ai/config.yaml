name: dashboard-ai
description: |
  Browseable web dashboard for a Smith-managed project. Launches a
  zero-dependency Node HTTP server (no npm install) serving a React
  UI loaded from CDN. The server discovers everything by scanning
  the consumer's filesystem from the path + invocation templates
  declared in `.smith/paths.yaml` — no provider list is hardcoded
  in the bundle. For every installed skill the dashboard surfaces
  the name, description, and the provider-correct invocation
  command (derived from `paths.yaml::skill_invocation`). Writes a
  `.smith/dashboard.json` snapshot at startup ; read-only on the
  consumer source for everything else.
version: 0.1.0
tags: [observability, docs, slash-command]
providers: [claude-code, github-copilot, opencode, gemini-cli]
skills:
  - name: dashboard-ai
    version: 0.1.0
hooks: []
