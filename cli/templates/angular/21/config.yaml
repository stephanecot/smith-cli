framework: angular
version: "21"
description: |
  Skill templates for Angular 21 projects (zoneless, signals, Tailwind v4,
  Vitest, Transloco i18n, OpenAPI-generated HTTP clients). Each skills/<slug>/
  directory ships a body (template.md), common metadata (metadata.yml), and
  per-provider frontmatter overrides (<provider>.yml). smith-template-install
  composes the frontmatter at install time and names the destination skill
  `smith-angular-<slug>` in the consumer project's provider-native skill dir.
providers: [claude-code, github-copilot, opencode]
skills:
  - name: bootstrap
    version: 0.1.0
  - name: standards
    version: 0.1.0
  - name: tests-coverage
    version: 0.1.0
  - name: design-system
    version: 0.1.0
  - name: i18n-transloco
    version: 0.1.0
  - name: openapi-client
    version: 0.1.0
adapter_placeholders:
  "{{language}}": Always "typescript" for this template set.
  "{{runtime}}": "nodejs"
  "{{framework}}": "angular"
  "{{framework_version}}": "21"
  "{{root_package}}": Project's npm package name (from package.json).
