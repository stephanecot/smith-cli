kind: hook
provider: claude-code
title: Hook (.claude/settings.json hooks key)
consumer_path: .claude/settings.json (hooks key)
example: example/example-hook.json

events:
  - name: SessionStart
    fires: At session start / resume / clear / compact
    can_block: false
    matcher: [startup, resume, clear, compact]
    default_timeout_seconds: 600

  - name: Setup
    fires: With `--init-only`, `--init`, or `--maintenance`
    can_block: false
    matcher: [init, maintenance]
    default_timeout_seconds: 600

  - name: UserPromptSubmit
    fires: User submits a prompt (before Claude sees it)
    can_block: true
    matcher: null
    default_timeout_seconds: 30

  - name: UserPromptExpansion
    fires: Slash command expands before reaching Claude
    can_block: true
    matcher: command name
    default_timeout_seconds: 30

  - name: PreToolUse
    fires: Before any tool call
    can_block: true
    matcher: tool name regex
    default_timeout_seconds: 600

  - name: PermissionRequest
    fires: Before the permission dialog
    can_block: true
    matcher: tool name
    default_timeout_seconds: 600

  - name: PermissionDenied
    fires: When auto-mode denies a tool call
    can_block: false
    matcher: tool name
    default_timeout_seconds: 600

  - name: PostToolUse
    fires: After any tool call succeeds
    can_block: false
    matcher: tool name
    default_timeout_seconds: 600

  - name: PostToolUseFailure
    fires: After any tool call fails
    can_block: false
    matcher: tool name
    default_timeout_seconds: 600

  - name: PostToolBatch
    fires: After a batch of parallel tool calls resolves
    can_block: true
    matcher: null
    default_timeout_seconds: 600

  - name: Stop
    fires: When Claude finishes responding
    can_block: true
    matcher: null
    default_timeout_seconds: 600

  - name: StopFailure
    fires: Turn ends due to API error
    can_block: false
    matcher: error type
    default_timeout_seconds: 600

  - name: Notification
    fires: Notification dispatched
    can_block: false
    matcher: notification type
    default_timeout_seconds: 600

  - name: SubagentStart
    fires: A sub-agent is spawned
    can_block: false
    matcher: agent type
    default_timeout_seconds: 600

  - name: SubagentStop
    fires: A sub-agent finishes
    can_block: true
    matcher: agent type
    default_timeout_seconds: 600

  - name: TeammateIdle
    fires: Agent-team teammate about to go idle
    can_block: true
    matcher: null
    default_timeout_seconds: 600

  - name: TaskCreated
    fires: TaskCreate tool fires
    can_block: true
    matcher: null
    default_timeout_seconds: 600

  - name: TaskCompleted
    fires: TaskUpdate sets a task to completed
    can_block: true
    matcher: null
    default_timeout_seconds: 600

  - name: ConfigChange
    fires: Settings file changes mid-session
    can_block: true
    matcher: config source
    default_timeout_seconds: 600

  - name: CwdChanged
    fires: Working directory changes
    can_block: false
    matcher: null
    default_timeout_seconds: 600

  - name: FileChanged
    fires: A watched file changes on disk
    can_block: false
    matcher: literal filenames (e.g. .env)
    default_timeout_seconds: 600

  - name: WorktreeCreate
    fires: A worktree is being created
    can_block: true
    matcher: null
    default_timeout_seconds: 600

  - name: WorktreeRemove
    fires: A worktree is being removed
    can_block: false
    matcher: null
    default_timeout_seconds: 600

  - name: PreCompact
    fires: Before auto-compaction
    can_block: true
    matcher: [manual, auto]
    default_timeout_seconds: 600

  - name: PostCompact
    fires: After auto-compaction
    can_block: false
    matcher: [manual, auto]
    default_timeout_seconds: 600

  - name: InstructionsLoaded
    fires: A CLAUDE.md / .claude/rules/*.md loads
    can_block: false
    matcher: load reason
    default_timeout_seconds: 600

  - name: Elicitation
    fires: MCP server asks for user input
    can_block: true
    matcher: MCP server name
    default_timeout_seconds: 600

  - name: ElicitationResult
    fires: User responded to MCP elicitation
    can_block: true
    matcher: MCP server name
    default_timeout_seconds: 600

  - name: SessionEnd
    fires: Session terminates
    can_block: false
    matcher: exit reason
    default_timeout_seconds: 600

handler_types:
  - type: command
    fields:
      - command (path)
      - args[]
      - async
      - asyncRewake
      - shell (bash | powershell)
    notes: Default; runs a host process.

  - type: http
    fields:
      - url
      - "headers{}"
      - allowedEnvVars[]
    notes: POST the payload to a webhook.

  - type: mcp_tool
    fields:
      - server
      - tool
      - "input{} (with ${...} placeholders)"
    notes: Calls an MCP tool with the event payload.

  - type: prompt
    fields:
      - prompt
      - model
    notes: Asks Claude to evaluate something (e.g. safety check). Timeout 30s default.

  - type: agent
    fields:
      - prompt
    notes: Delegates to a sub-agent. Timeout 60s default.

shared_handler_fields:
  - field: if
    meaning: "Sub-matcher like `Bash(rm *)`."
  - field: timeout
    meaning: Seconds.
  - field: statusMessage
    meaning: Custom spinner.
  - field: once
    meaning: Run once per session.

conventions:
  - "Keep hook commands short and side-effect-only; long work must use `async: true`."
  - Never raise from a command hook — log to stderr and exit 0 (or exit 2 for blocking events). A persistently failing hook may be auto-disabled.
  - Idempotent — Claude Code may retry on timeout.
  - "Permission-decision merging when multiple hooks return on the same event: `deny` > `block` / `ask` > `allow` / `defer`."