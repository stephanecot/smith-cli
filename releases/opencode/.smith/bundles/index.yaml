version: 1
bundles:
- name: dashboard-ai
  description: Browseable web dashboard for a Smith-managed project. Launches a zero-dependency Node HTTP server (no npm install) serving a React UI loaded from CDN. The server discovers everything by scanning the consumer's filesystem from the path + invocation templates declared in `.smith/paths.yaml` — no provider list is hardcoded in the bundle. For every installed skill the dashboard surfaces the name, description, and the provider-correct invocation command. Writes a `.smith/dashboard.json` snapshot at startup ; read-only on the consumer source for everything else.
  directory: dashboard-ai
  version: 0.1.0
  tags:
  - observability
  - docs
  - slash-command
  skills:
  - name: dashboard-ai
    version: 0.1.0
  hooks: []
- name: ia-stats
  description: Automatic per-agent / per-skill usage tracker. Every event appends a row to IA_STATS.MD at the consumer project's root via a Node.js script. Cross-platform (Windows + macOS + Linux), zero npm deps. Shipped for Claude Code (real event hooks) and OpenCode (plugin lifecycle hooks). GitHub Copilot ships the read-only `/ia-stats` skill only — VS Code tasks cannot carry per-event payloads, so no populating hook is provided.
  directory: ia-stats
  version: 0.1.0
  core: true
  tags:
  - observability
  - hooks
  skills:
  - name: ia-stats
    version: 0.1.0
  hooks:
  - name: ia-stats
    version: 0.1.0
- name: mvn
  description: Maven offload — /mvn <goals> dispatches a Maven build off the parent context so multi-thousand-line build logs do not flood the conversation. Returns a one-line verdict + Tests counters + failure cause.
  directory: mvn
  version: 0.1.0
  tags:
  - build
  - java
  - backend
  skills:
  - name: mvn
    version: 0.1.0
  hooks: []
- name: npm
  description: npm offload — /npm <args> dispatches an npm command off the parent context so multi-thousand-line Vitest / Vite / lint logs do not flood the conversation. Returns a one-line verdict + Tests/lint/build counters + failure cause.
  directory: npm
  version: 0.1.0
  tags:
  - build
  - nodejs
  - frontend
  skills:
  - name: npm
    version: 0.1.0
  hooks: []
- name: pip
  description: pip offload — /pip <args> dispatches a Python pip command off the parent context so multi-thousand-line resolver / install logs do not flood the conversation. Returns a one-line verdict + counters (installed / upgraded / removed / failed) + failure cause.
  directory: pip
  version: 0.1.0
  tags:
  - build
  - python
  - python3
  skills:
  - name: pip
    version: 0.1.0
  hooks: []
